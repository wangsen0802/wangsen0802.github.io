<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="g" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="55%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </radialGradient>
    <radialGradient id="s" cx="32%" cy="28%" r="35%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c">
      <circle cx="50" cy="50" r="44"/>
    </clipPath>
  </defs>

  <!-- Globe -->
  <g clip-path="url(#c)">
    <circle cx="50" cy="50" r="44" fill="url(#g)"/>
    <!-- Meridians -->
    <ellipse cx="50" cy="50" rx="17" ry="44" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width=".9"/>
    <ellipse cx="50" cy="50" rx="33" ry="44" fill="none" stroke="#fff" stroke-opacity=".15" stroke-width=".7"/>
    <line x1="50" y1="6" x2="50" y2="94" stroke="#fff" stroke-opacity=".2" stroke-width=".8"/>
    <!-- Parallels -->
    <line x1="6" y1="30" x2="94" y2="30" stroke="#fff" stroke-opacity=".15" stroke-width=".7"/>
    <line x1="6" y1="50" x2="94" y2="50" stroke="#fff" stroke-opacity=".25" stroke-width=".9"/>
    <line x1="6" y1="70" x2="94" y2="70" stroke="#fff" stroke-opacity=".15" stroke-width=".7"/>
  </g>
  <!-- Shine -->
  <circle cx="50" cy="50" r="44" fill="url(#s)"/>
  <!-- Outline -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#60A5FA" stroke-width="1.5"/>

  <!-- Location pin -->
  <g transform="translate(64,32)">
    <path d="M0-8C4.4-8 8-4.4 8 0 8 5 0 11 0 11S-8 5-8 0C-8-4.4-4.4-8 0-8z" fill="#F97316" stroke="#fff" stroke-width="1.2"/>
    <circle r="2.8" fill="#fff"/>
  </g>
</svg>
